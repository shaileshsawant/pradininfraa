<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Pradin Infraa">
  <defs>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#C97F0E"/>
      <stop offset=".5" stop-color="#F0A81E"/>
      <stop offset="1" stop-color="#F7C948"/>
    </linearGradient>
    <linearGradient id="navyG" x1="0" y1="0" x2="0" y2="1">
