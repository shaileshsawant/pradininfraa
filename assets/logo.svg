    <rect x="51.5" y="50" width="4" height="5"/><rect x="57.5" y="50" width="4" height="5"/>
    <rect x="51.5" y="59" width="4" height="5"/><rect x="57.5" y="59" width="4" height="5"/>
    <rect x="51.5" y="68" width="4" height="5"/><rect x="57.5" y="68" width="4" height="5"/>
    <rect x="51.5" y="77" width="4" height="5"/><rect x="57.5" y="77" width="4" height="5"/>
    <rect x="71.5" y="62" width="3.5" height="4.5"/><rect x="76.5" y="62" width="3.5" height="4.5"/>
    <rect x="71.5" y="70" width="3.5" height="4.5"/><rect x="76.5" y="70" width="3.5" height="4.5"/>
    <rect x="71.5" y="78" width="3.5" height="4.5"/><rect x="76.5" y="78" width="3.5" height="4.5"/>
    <rect x="89" y="76" width="3.5" height="4.5"/><rect x="94" y="76" width="3.5" height="4.5"/>
    <rect x="89" y="84" width="3.5" height="4.5"/><rect x="94" y="84" width="3.5" height="4.5"/>
